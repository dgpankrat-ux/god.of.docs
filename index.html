<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>God of Docs</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
  <meta name="description" content="Личная база знаний по технической документации и техническому письму">
  <link rel="stylesheet" href="vendor/docsify/vue.css">
  <style>
    :root {
      --theme-color: #6c5ce7;
    }
    .app-name-link img { display: none; }
    body { -webkit-font-smoothing: antialiased; }
    .local-file {
      cursor: pointer;
      color: var(--theme-color);
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div id="app"></div>
  <script>
    window.$docsify = {
      name: 'God of Docs',
      loadSidebar: true,
      subMaxLevel: 3,
      auto2top: true,
      routerMode: 'hash',
      alias: {
        '/.*/_sidebar.md': '/_sidebar.md'
      },
      search: {
        maxAge: 86400000,
        paths: 'auto',
        placeholder: 'Поиск по базе знаний...',
        noData: 'Ничего не найдено.',
        depth: 3
      },
      formatUpdated: '{MM}/{DD} {HH}:{mm}'
    }
  </script>
  <script src="vendor/docsify/docsify.min.js"></script>
  <script src="vendor/docsify/search.min.js"></script>
  <script src="vendor/docsify/zoom-image.min.js"></script>
  <script>
    // Docsify's router rewrites every internal <a href> — even a raw HTML one — into
    // its own hash route, so binary files (PDF/DOCX) 404 as if they were doc pages.
    // Local file links use a plain <span data-path="..."> instead, opened here via a
    // single delegated click handler that bypasses the router entirely.
    document.addEventListener('click', function (e) {
      var el = e.target.closest('.local-file');
      if (!el) return;
      e.preventDefault();
      window.open(location.origin + '/' + el.getAttribute('data-path'), '_blank', 'noopener');
    });
  </script>
</body>
</html>
